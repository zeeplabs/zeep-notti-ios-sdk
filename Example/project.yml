name: NottiExample
options:
  bundleIdPrefix: invalid.example.notti
  deploymentTarget:
    iOS: "15.0"
  createIntermediateGroups: true
configFiles:
  Debug: Config/Example.xcconfig
  Release: Config/Example.xcconfig
  Debug-Manual: Config/Example.xcconfig
  Debug-NoAdaptor: Config/Example.xcconfig
configs:
  Debug: debug
  Release: release
  Debug-Manual: debug
  Debug-NoAdaptor: debug
packages:
  NottiSDK:
    path: ..
settings:
  base:
    SWIFT_VERSION: "5.9"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
    TARGETED_DEVICE_FAMILY: "1"
    SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) USE_ADAPTOR"
schemes:
  NottiExample:
    build:
      targets:
        NottiExample: all
    test:
      config: Debug
      targets: [NottiExampleTests]
    run:
      config: Debug
  NottiExample-Manual:
    build:
      targets:
        NottiExample: all
    test:
      config: Debug-Manual
      targets: [NottiExampleTests]
    run:
      config: Debug-Manual
  NottiExample-NoAdaptor:
    build:
      targets:
        NottiExample: all
    test:
      config: Debug-NoAdaptor
      targets: [NottiExampleTests]
    run:
      config: Debug-NoAdaptor
targets:
  NottiExample:
    type: application
    platform: iOS
    sources: [App]
    dependencies:
      - package: NottiSDK
        product: NottiSDK
      - target: NotificationService
        embed: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: invalid.example.notti.app
        CODE_SIGN_ENTITLEMENTS: App/App.entitlements
        GENERATE_INFOPLIST_FILE: NO
      configs:
        Debug:
          INFOPLIST_FILE: App/Info.plist
        Release:
          INFOPLIST_FILE: App/Info.plist
        Debug-Manual:
          INFOPLIST_FILE: App/Info-Manual.plist
        Debug-NoAdaptor:
          INFOPLIST_FILE: App/Info.plist
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited)"
  NotificationService:
    type: app-extension
    platform: iOS
    sources: [NotificationService]
    dependencies:
      - package: NottiSDK
        product: NottiSDKExtension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: invalid.example.notti.app.NotificationService
        INFOPLIST_FILE: NotificationService/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        APPLICATION_EXTENSION_API_ONLY: YES
  NottiExampleTests:
    type: bundle.unit-test
    platform: iOS
    sources: [Tests]
    dependencies:
      - target: NottiExample
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: invalid.example.notti.tests
        GENERATE_INFOPLIST_FILE: YES
