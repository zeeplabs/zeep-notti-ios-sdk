name: CI

on:
  pull_request:
  push:
    branches: [main]
    tags: ['*']

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Pinned against the macos-26 runner image (actions/runner-images README,
  # checked 2026-10-09). Update both together when the image changes.
  XCODE_APP: /Applications/Xcode_26.6.app
  NOTTI_SIM: iPhone 17
  SWIFTLINT_IMAGE: ghcr.io/realm/swiftlint:0.65.1
  # The example project is generated, never committed (EXR-23). The job fails if brew serves another version.
  XCODEGEN_VERSION: 2.46.0

jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: SwiftLint
        run: docker run --rm -v "$PWD:/w" -w /w "$SWIFTLINT_IMAGE" lint --strict --reporter github-actions-logging

  checks:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Version drift (PKG-15)
        run: scripts/check-version.sh

      - name: Extension safety (PKG-03)
        run: scripts/check-extension-safety.sh

      # Textual (grep/awk/sort/diff), so it needs no Swift toolchain (API-15).
      - name: Public API surface (API-15)
        run: scripts/check-public-surface.sh

      # The SDK passes a tapped push's `data` to the host and never opens a link itself (DEL-18).
      - name: No URL opening (DEL-18)
        run: scripts/check-no-url-open.sh

      # `+load` does no logging, preference or file I/O, network or runtime access (DEL-14).
      - name: Launch hook purity (DEL-14)
        run: scripts/check-launch-hook-purity.sh

      # The extension logs only through NottiLogger and never prints a URL-carrying error (NSE-13).
      - name: Extension logging (NSE-13)
        run: scripts/check-nse-logging.sh

      # Every public member in scope is called by the example app (EXR-02).
      - name: Example coverage (EXR-02)
        run: scripts/check-example-coverage.sh

      # The two Info.plists differ only by NottiDisableSwizzling; no real key or app id is committed (EXR-04, EXR-06).
      - name: Example config (EXR-04, EXR-06)
        run: scripts/check-example-config.sh

      # README snippets equal the example sources they are cut from, and those sources are compiled (EXR-13).
      - name: README snippets (EXR-13)
        run: scripts/check-readme-snippets.sh

  test:
    runs-on: macos-26
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Select Xcode
        run: |
          sudo xcode-select -s "$XCODE_APP"
          xcodebuild -version

      # Prints what the runner actually has, so a drifted pin fails with an
      # actionable log instead of a bare "destination not found".
      - name: Toolchain sanity
        run: |
          xcodebuild -list
          xcodebuild -showsdks | grep -i iphone
          xcrun simctl list devices available | grep -F "$NOTTI_SIM" || {
            echo "::error::Simulator '$NOTTI_SIM' not available on this runner"; exit 1; }

      # `-retry-tests-on-failure` keeps infra noise from failing the build; the
      # next step surfaces any retry as a warning so a real flake stays visible.
      - name: Unit tests
        run: |
          set -o pipefail
          xcodebuild test \
            -scheme NottiSDK-Package \
            -destination "platform=iOS Simulator,name=$NOTTI_SIM" \
            -retry-tests-on-failure \
            -test-iterations 2 \
            CODE_SIGNING_ALLOWED=NO \
            | tee "$RUNNER_TEMP/notti-tests.log"

      # Xcode 26+ marks a retried test as "started (Iteration 2 of 2)"; the older
      # phrases are kept for a crash-restart. Any match means a test failed at
      # least once, even if the job ends green.
      - name: Flag retried (flaky) tests
        if: always()
        run: |
          log="$RUNNER_TEMP/notti-tests.log"
          pattern='started \(Iteration [2-9][0-9]* of|Restarting tests after unexpected exit'
          if grep -qE "$pattern" "$log" 2>/dev/null; then
            echo "::warning::Tests needed a retry - a test is flaky, not just green. Investigate before release."
            grep -nE "$pattern" "$log" || true
          fi

      # Warnings fail these builds (PKG-04). The extension product is also built
      # with APPLICATION_EXTENSION_API_ONLY so the compiler rejects app-only API (PKG-03).
      - name: Device builds (PKG-03, PKG-04)
        run: |
          set -o pipefail
          strict=(CODE_SIGNING_ALLOWED=NO SWIFT_TREAT_WARNINGS_AS_ERRORS=YES GCC_TREAT_WARNINGS_AS_ERRORS=YES)
          xcodebuild build -scheme NottiSDK -destination 'generic/platform=iOS' "${strict[@]}" -quiet
          xcodebuild build -scheme NottiSDKExtension -destination 'generic/platform=iOS' "${strict[@]}" APPLICATION_EXTENSION_API_ONLY=YES -quiet

      # Builds scripts/hook-consumer in Release for the simulator, runs it and requires that the ObjC
      # `+load` hook ran once and found the Swift installer (DEL-01). Boots $NOTTI_SIM if needed.
      - name: Launch hook is linked and runs (DEL-01)
        run: scripts/check-hook-linked.sh spm

  pod-lint:
    runs-on: macos-26
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Select Xcode
        run: |
          sudo xcode-select -s "$XCODE_APP"
          pod --version

      # Fails if the platform/tools version drift or the extension product/subspec ever
      # depends on, compiles or bundles app code, or a pod gains a subspec (PKG-01, PKG-02, PKG-06, PKG-07, PODS-04).
      - name: Package graph (PKG-01, PKG-02, PKG-06)
        run: scripts/check-package-graph.sh

      - name: pod lib lint (NottiSDK)
        run: pod lib lint NottiSDK.podspec --platforms=ios

      - name: pod lib lint (NottiSDKExtension)
        run: pod lib lint NottiSDKExtension.podspec --platforms=ios

      # Static libraries are the React Native default (PODS-07).
      - name: pod lib lint (NottiSDK, static libraries)
        run: pod lib lint NottiSDK.podspec --platforms=ios --use-libraries

      - name: pod lib lint (NottiSDKExtension, static libraries)
        run: pod lib lint NottiSDKExtension.podspec --platforms=ios --use-libraries

      # Lints NottiSDK keeping the build, then checks the class is in the pod product (DEL-01).
      - name: Launch hook is in the pod product (DEL-01)
        run: scripts/check-hook-linked.sh pod

  # Builds and tests the example app through SPM and the three CocoaPods linkages (EXR-17, EXR-23). Each leg runs
  # on its own runner and its steps run one after another, so no two xcodebuild processes share a checkout.
  example:
    runs-on: macos-26
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - leg: spm
            spec: project.yml
            linkage: ''
          - leg: pods-static
            spec: project-pods.yml
            linkage: static
          - leg: pods-libs
            spec: project-pods.yml
            linkage: libs
          - leg: pods-dynamic
            spec: project-pods.yml
            linkage: dynamic
    defaults:
      run:
        working-directory: Example
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Select Xcode
        run: |
          sudo xcode-select -s "$XCODE_APP"
          xcodebuild -version
          xcrun simctl list devices available | grep -F "$NOTTI_SIM" || {
            echo "::error::Simulator '$NOTTI_SIM' not available on this runner"; exit 1; }

      - name: Install XcodeGen
        run: |
          brew install xcodegen
          actual="$(xcodegen --version | sed -E 's/[^0-9.]*([0-9.]+).*/\1/')"
          [[ "$actual" == "$XCODEGEN_VERSION" ]] || {
            echo "::error::XcodeGen $actual installed, workflow pins $XCODEGEN_VERSION. Update both together."; exit 1; }

      - name: Generate the project
        run: xcodegen generate --spec "${{ matrix.spec }}"

      - name: Pod install
        if: matrix.linkage != ''
        env:
          NOTTI_LINKAGE: ${{ matrix.linkage }}
        run: pod install

      # Hosted tests inside the app: privacy bundles, launch hook counts and the extension binary (EXR-18, EXR-19).
      - name: Test
        run: |
          set -o pipefail
          if [[ -n "${{ matrix.linkage }}" ]]; then container=(-workspace NottiExample.xcworkspace); else container=(-project NottiExample.xcodeproj); fi
          xcodebuild test "${container[@]}" -scheme NottiExample \
            -destination "platform=iOS Simulator,name=$NOTTI_SIM" \
            -derivedDataPath "$RUNNER_TEMP/dd-test" \
            CODE_SIGNING_ALLOWED=NO

      # Warnings fail the app and the extension (the extension target sets APPLICATION_EXTENSION_API_ONLY). Library
      # builds only: the test target keeps its own warnings (AD-014 D4).
      - name: Device build (warnings as errors)
        run: |
          set -o pipefail
          if [[ -n "${{ matrix.linkage }}" ]]; then container=(-workspace NottiExample.xcworkspace); else container=(-project NottiExample.xcodeproj); fi
          xcodebuild build "${container[@]}" -scheme NottiExample \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$RUNNER_TEMP/dd-device" \
            CODE_SIGNING_ALLOWED=NO SWIFT_TREAT_WARNINGS_AS_ERRORS=YES GCC_TREAT_WARNINGS_AS_ERRORS=YES -quiet
          plist="$(find "$RUNNER_TEMP/dd-device" -path '*NottiExample.app/Info.plist' | head -1)"
          ../scripts/check-example-config.sh --built "$plist" default

      # Debug-NoAdaptor must build without USE_ADAPTOR, or the "without @UIApplicationDelegateAdaptor" check proves nothing.
      - name: NoAdaptor configuration has no adaptor
        if: matrix.leg == 'spm'
        run: |
          flags="$(xcodebuild -project NottiExample.xcodeproj -target NottiExample -configuration Debug-NoAdaptor -showBuildSettings | sed -nE 's/^ *SWIFT_ACTIVE_COMPILATION_CONDITIONS = (.*)$/\1/p')"
          echo "Debug-NoAdaptor flags: $flags"
          [[ "$flags" == *DEBUG* ]] || { echo "::error::could not read the compilation conditions"; exit 1; }
          if grep -qw USE_ADAPTOR <<<"$flags"; then
            echo "::error::Debug-NoAdaptor still compiles with USE_ADAPTOR"; exit 1
          fi

      # Debug-Manual turns swizzling off through Info.plist; the built plist must hold a Boolean true (EXR-04).
      - name: Device build, Debug-Manual
        if: matrix.leg == 'spm'
        run: |
          set -o pipefail
          xcodebuild build -project NottiExample.xcodeproj -scheme NottiExample-Manual -configuration Debug-Manual \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$RUNNER_TEMP/dd-manual" \
            CODE_SIGNING_ALLOWED=NO SWIFT_TREAT_WARNINGS_AS_ERRORS=YES GCC_TREAT_WARNINGS_AS_ERRORS=YES -quiet
          plist="$(find "$RUNNER_TEMP/dd-manual" -path '*NottiExample.app/Info.plist' | head -1)"
          ../scripts/check-example-config.sh --built "$plist" manual

      # A leg must leave no generated project, workspace, Pods or lockfile in the tree that git tracks.
      - name: Nothing generated is tracked
        run: |
          if git ls-files . | grep -E '\.xcodeproj/|\.xcworkspace/|^Example/Pods/|^Pods/|Podfile\.lock'; then
            echo "::error::A generated file is tracked by git"; exit 1
          fi
          test -z "$(git status --porcelain --untracked-files=no .)" || {
            git status --short .; echo "::error::The leg modified a tracked file"; exit 1; }
